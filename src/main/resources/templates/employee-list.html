
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container px-3 px-md-4">
        <span class="navbar-brand mb-0 h1 fs-6 fs-md-5">
            <i class="bi bi-people-fill me-2"></i>
            Employee Management System
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container py-3 py-md-5 px-3 px-md-4">

    <!-- Page Header -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">

        <h2 class="page-title mb-0">
            Employees
        </h2>

        <a th:href="@{/employees/new}"
           class="btn btn-primary w-100 w-sm-auto">
            <i class="bi bi-plus-circle me-1"></i>
            Add Employee
        </a>

    </div>

    <!-- Employee Table Card -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <!-- Horizontal scroll on small screens -->
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>
                    <tr>
                        <th class="px-3 py-3">ID</th>
                        <th class="py-3">Name</th>
                        <th class="py-3">Email</th>
                        <th class="py-3">Department</th>
                        <th class="py-3">Salary</th>
                        <th class="py-3">Phone</th>
                        <th class="text-end px-3 py-3">Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- No Employees -->
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="7"
                            class="text-center text-muted py-4 px-3">
                            No employees found. Click "Add Employee" to create one.
                        </td>
                    </tr>

                    <!-- Employee Rows -->
                    <tr th:each="emp : ${employees}">

                        <td class="px-3" th:text="${emp.id}"></td>

                        <td th:text="${emp.name}"></td>

                        <td th:text="${emp.email}"></td>

                        <td>
                                <span class="badge-department"
                                      th:text="${emp.department}">
                                </span>
                        </td>

                        <td th:text="${'₹' + #numbers.formatDecimal(emp.salary, 1, 2)}"></td>

                        <td th:text="${emp.phone}"></td>

                        <td class="text-end px-3">

                            <div class="d-flex justify-content-end gap-1">

                                <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                                   class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil-square"></i>
                                    <span class="d-none d-md-inline">Edit</span>
                                </a>

                                <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Are you sure you want to delete this employee?');">
                                    <i class="bi bi-trash"></i>
                                    <span class="d-none d-md-inline">Delete</span>
                                </a>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

</div>

</body>
</html>
```
