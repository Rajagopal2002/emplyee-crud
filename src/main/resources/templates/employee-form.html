
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Employee Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container px-3 px-md-4">
        <span class="navbar-brand mb-0 h1 fs-6 fs-md-5">
            <i class="bi bi-people-fill me-2"></i>
            Employee Management System
        </span>
    </div>
</nav>

<div class="container py-3 py-md-5 px-3 px-md-4">

    <div class="row justify-content-center">

        <!-- Responsive width:
             Mobile  : 100%
             Tablet  : 75%
             Desktop : 58% approximately
        -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-3 p-sm-4 p-md-4">

                    <h4 class="page-title mb-4 fs-5 fs-md-4"
                        th:text="${formTitle}">
                        Employee Form
                    </h4>

                    <form th:action="@{/employees/save}"
                          th:object="${employee}"
                          method="post"
                          novalidate>

                        <input type="hidden" th:field="*{id}"/>

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="e.g. Priya Sharma">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   placeholder="e.g. priya@company.com">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <!-- Department -->
                        <div class="mb-3">
                            <label class="form-label">Department</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{department}"
                                   placeholder="e.g. Engineering">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('department')}"
                                 th:errors="*{department}">
                            </div>
                        </div>

                        <!-- Salary -->
                        <div class="mb-3">
                            <label class="form-label">Salary</label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{salary}"
                                   placeholder="e.g. 55000">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('salary')}"
                                 th:errors="*{salary}">
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-4">
                            <label class="form-label">Phone</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{phone}"
                                   placeholder="e.g. 9876543210">
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">

                            <a th:href="@{/employees}"
                               class="btn btn-outline-secondary w-100 w-sm-auto">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary w-100 w-sm-auto">
                                <i class="bi bi-check-circle me-1"></i>
                                Save
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
